  h0_3: h0_3
  h0_4: h0_4
  sigma_up_1: sig_up_1
  sigma_up_2: sig_up_2
  sigma_up_3: sig_up_3
  sigma_up_4: sig_up_4
  sigma_down_1: sig_dn_1
  sigma_down_2: sig_dn_2
  sigma_down_3: sig_dn_3
  sigma_down_4: sig_dn_4
  PA_1: PA_1
  PA_2: PA_2
  PA_3: PA_3
  PA_4: PA_4
  Norm_1: N_1
  Norm_2: N_2
  Norm_3: N_3
  Norm_4: N_4

VARIABLES:
  beta_1: beta_1
  beta_2: beta_2
  beta_3: beta_3
  beta_4: beta_4
  h0_1: h0_1
  h0_2: h0_2
  h0_3: h0_3
  h0_4: h0_4
  sigma_up_1: sigma_up_1
  sigma_up_2: sigma_up_2
  sigma_up_3: sigma_up_3
  sigma_up_4: sigma_up_4
  sigma_down_1: sigma_down_1
  sigma_down_2: sigma_down_2
  sigma_down_3: sigma_down_3
  sigma_down_4: sigma_down_4
  PA_1: PA_1
  PA_2: PA_2
  PA_3: PA_3
  PA_4: PA_4
  Norm_1: Norm_1
  Norm_2: Norm_2
  Norm_3: Norm_3
  Norm_4: Norm_4

COMMENTS:
  beta_1: 'WDH radial exponent beta, layer 1'
  beta_2: 'WDH radial exponent beta, layer 2'
  beta_3: 'WDH radial exponent beta, layer 3'
  beta_4: 'WDH radial exponent beta, layer 4'
  h0_1: 'WDH scale h0 / a_r, layer 1'
  h0_2: 'WDH scale h0 / a_r, layer 2'
  h0_3: 'WDH scale h0 / a_r, layer 3'
  h0_4: 'WDH scale h0 / a_r, layer 4'
  sigma_up_1: 'Lobe width sigma (x_rot>0), layer 1'
  sigma_up_2: 'Lobe width sigma (x_rot>0), layer 2'
  sigma_up_3: 'Lobe width sigma (x_rot>0), layer 3'
  sigma_up_4: 'Lobe width sigma (x_rot>0), layer 4'
  sigma_down_1: 'Lobe width sigma (x_rot<=0), layer 1'
  sigma_down_2: 'Lobe width sigma (x_rot<=0), layer 2'
  sigma_down_3: 'Lobe width sigma (x_rot<=0), layer 3'
  sigma_down_4: 'Lobe width sigma (x_rot<=0), layer 4'
  PA_1: 'Position angle, layer 1'
  PA_2: 'Position angle, layer 2'
  PA_3: 'Position angle, layer 3'
  PA_4: 'Position angle, layer 4'
  Norm_1: 'Amplitude Norm, layer 1 (sampled in ln space)'
  Norm_2: 'Amplitude Norm, layer 2 (sampled in ln space)'
  Norm_3: 'Amplitude Norm, layer 3 (sampled in ln space)'
  Norm_4: 'Amplitude Norm, layer 4 (sampled in ln space)'

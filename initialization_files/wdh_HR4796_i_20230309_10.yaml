# PYKLIP PARAMETERS
FIRST_TIME: True
FIRST_TIME_GS: False #first time doing pyklip gridsearch
#if FIRST_TIME=True the masks, reduced data, noise map, PSF lib, KL vectors are (re)calculated.
DISK_MODEL: wdh # original or modified Max MB model code
MODE: ADI  #ADI or  RDI (probably also work for SDI and ADI + SDI but too slow to be usefull)
DO_RDI_CORRELATION: False # Measure the correlation matrix of the RDI PSF lib. Very long.
# KL mode number optimized for z-band, 2x2 binning, minor axis flux 02/20/24 JKK
KLMODE_NUMBER: 1 # number of KL modes used in the reduction < nb images in the basis
ANNULI: 1 # number of annuli in the KLIP reduction
# IWA optimized for z-band speckles, 2x2 binning, minor axis flux 03/20/24 JKK
IWA: 10 # pixels
OWA: 112 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
MOVE_HERE: 6  #minrot in PyKLIP ADI
HP_FILTER: False #size of FWHM for HP filter, disabled in diskfit_mcmc for now
#use [int((thumb_dim+1)/2),int((thumb_dim+1)/2)]
# ALIGNED_CENTER: [120,120] #image center in your model, also use to center the image before KLIP
ALIGNED_CENTER: [111.5,111.5] #image center in your model, also use to center the image before KLIP
WL: 0.762 #wavelength in microns
LYOT_LAMBDA_OVER_D: 3.0
# The optimal parang span is 82 deg.

#  In the KLIP do you want to remove the images where the disk is on the satspots 
# if True: frames are removed
# if False: frames are not removed
RM_FILE_DISK_CROSS_SATSPOTS: False 
# The images where the disk is on the satspots are autonatically remove to measure the PSF
INSTRUMENT: MagAO-X  # SPHERE or GPI
# LOCATION AND NAME PARAMETERS. Parameters used to save the outputs or plots
# BAND_DIR: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci1/lite_wdhlib/wdh_subtracted  # name of folder where are the data (from basedir)
BAND_DIR: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci1/lite_wdhlib  # name of folder where are the data (from basedir)
WDHSUB_DIR: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci1/lite_psflib  # name of folder where are the data (from basedir)
KLIP_FM_FILES_PATH: null # location of ff_klip/ff_setup output folder klip_fm_files. Optional. If null, BAND_DIR/klip_fm_files is used.
SPARKLE_COORDS_FILE: stacked/sparkle_coords_coron_thumbnail.txt # from BAND_DIR
RDI_DIR: lite_psflib       # name of folder where are the RDI lib (starting from BAND_DIR). 
#                         # Carefull, this dir must also contains the data
# FILE_PREFIX: Ls_clio_20140411_12 #prefix for all saved files (carefull not to erase your results)
FILE_PREFIX: camsci1_i_20230309_10 #prefix for all saved files (carefull not to erase your results)
BAND_NAME: 2023 Mar 9, $i'$ band #for plot titles uniquely

# STAR OBSERVATION PARAMETERS
DISTANCE_STAR: 72.8   #distance of the disk in pc
PIXSCALE_INS: 0.012  #picscale of your data

# GRIDSEARCH PARAMS
GRIDSEARCH_DIR: pyklip_reduced
IWA_MIN: 5
IWA_MAX: 16
MINROT_MIN: 10
MINROT_MAX: 12
PARANG_MIN: 80
PARANG_MAX: 88
HP_MIN: 15
HP_MAX: 32

# MCMC PARAMETERS
NEW_BACKEND: True
#if NEW_BACKEND=0, reset the backend, if not, start where you stopped
NWALKERS: 94 #Number of walkers (should be at least twice the # parameters)
#~530 iter w/ 94 cpus in 24 hr
N_ITER_MCMC: 1000 #Number of interation
NOISE_MULTIPLICATION_FACTOR: 1 # multiplicative factor for the chains, previously 3; 04/25/23
# There is no burn-in phase here, the burnin only intervened when reading the data

# INITIAL MODEL PARAMETERS
r1_init: 76.0 #include just for initializing the mask function
r2_init: 88.00 #include just for initializing the mask function
rc_init: 77.7 #35.5 #trying 39. for the masks
alpha_in_init: 12
alpha_out_init: -12
beta_init: 19.5
a_r_init: 0.01
inc_init: 76.4 #trying 45. init for the mask2minimize
pa_init: 24.9
dx_init: -3.5
dy_init: 1.58
N_init: 740.32
# amin_init: 0.68 #microns
# amax_init: 10000. #microns, let's fix this for now
# aexp_init: 3.5 #radial pwer law for size distribution of grains
r_inner: 65
r_outer: 110

# MODEL PARAMETER STATES [0,1] --> [fixed, free]
r1_state: 1
r2_state: 1
rc_state: 0
alpha_in_state: 0
alpha_out_state: 0
beta_state: 1
a_r_state: 0
inc_state: 1
pa_state: 1
dx_state: 1
dy_state: 1
N_state: 1
# amin: 0
# amax: 0
# aexp: 0
g1_state: 1
g2_state: 1
alpha1_state: 1
g3_state: 0
alpha2_state: 0

# WIND PARAMETERS
N_WIND_LAYERS: 3
gamma_fixed: 1.0
beta_shared_state: false
a_r_shared_state: false
sig_shared_state: false
dx_shared_state: false
Norm_shared_state: false
pa_prior_sigma: 10.0

hr1_init: 0.1 #include just for initializing the mask function
hr2_init: 60 #include just for initializing the mask function

hbeta_init: 0.44
ha_r_init: 0.16
hsig_up_init: 29.0
hsig_down_init: 30.0
hpa_init: 250.0
hdx_init: 0.0
hdy_init: 0.007
hN_init: 27317.36

hbeta2_init: 0.06
ha_r2_init: 0.29
hsig2_up_init: 19.0
hsig2_down_init: 18.0
# hpa2_init: 176.0
hpa2_init: 125.0
hdx2_init: 0.0
hdy2_init: 0.0
hN2_init: 2910.7

hbeta3_init: 0.16
ha_r3_init: 0.2
hsig3_init: 30.0
hsig3_up_init: 30.0
hsig3_down_init: 30.0
hpa3_init: 230.0
hdx3_init: 0.0
hdy3_init: 0.0
hN3_init: 2000.0

# WIND PARAMETER STATES [0,1] --> [fixed, free]
hbeta_state: 1
ha_r_state: 1
hsig_state: 1
# hdx_init / hdxN_init: fixed offset x0 (not sampled; lobe asymmetry via sigma_up/down)
hdx_state: 0
hpa_state: 1
hdy_state: 1
# hoffset_state: 1
hN_state: 1

hbeta2_state: 1
ha_r2_state: 1
hsig2_state: 1
hpa2_state: 1
hdx2_state: 0
hdy2_state: 1
hN2_state: 1

hbeta3_state: 1
ha_r3_state: 1
hpa3_state: 0
hdx3_state: 0
hdy3_state: 1
hN3_state: 1

# Added explicit third-component aliases used by the refactored parser.
beta3_state: 1
a_r3_state: 1
sig3_state: 1
pa3_state: 0
dx3_state: 0
dy3_state: 1
Norm3_state: 1

USE_NOISE: True
# If the radial prof was subtracted during the image preprocessing + registration
RPROFSUB: True

# MASKING PARAMETERS
MASK_IN_SCALING: 1
MASK_OUT_SCALING: 1
MASK_SPECKLES: 6 #central circle mask
MASK_MINOR: 58 #OWA to isolate minor axis
MASK_DX: 0
MASK_DY: -3
MASK_OPENING_ANGLE: 90
DELTA_RADII: 1 #width of noisemap rings
MASK_SELFSUB_LOWER: 350
MASK_SELFSUB_UPPER: 54
# Measured disk spine profile in z'
WIDOW_MASK: False
WIDOW_PT1: [127,130] #[y,x], 53.4 deg from horizontal
WIDOW_PT2: [138,107] #[y,x], -11.1 deg from horizontal 
WIDOW_PT3: [98,91] #[y,x], 53.4 deg from horizontal
WIDOW_PT4: [87,117] #[y,x], -11.1 deg from horizontal 

# offset: 0.
# the parameter of the priors are still defined inside the code logp(theta) function

# SPF parameters
SPF_MODEL: hg_2g # Heyniey greenstein ('hg_1g', 'hg_2g', 'hg_3g') or 
# SPF_MODEL: adp # Agglomerated Dust Particle; Arnold et al. 2022
SPF_BASIS: legendre # Fit Fourier series model

MIN_SCATT_ANG: 13
MAX_SCATT_ANG: 167
N_BASIS: 10

# for 1g SPF (N_DIM_MCMC = 9) and more
g1_init: 0.83

# for 2g SPF (N_DIM_MCMC = 11) and 3g SPF (N_DIM_MCMC = 13) only
g2_init: -0.19
alpha1_init: 0.32 

# for 3g SPF (N_DIM_MCMC = 13) only
g3_init: -0.1
alpha2_init: 0.1


# MCMC PLOTTING PARAMETERS
BURNIN: 200   #We remove the first BURNIN iteration
THIN: 1       #thin (bin) the chains
QUALITY_PLOT: 4 # usefull because corner plots can be huge. When paper, QUALITY_PLOT: 4
sigma: 1 # the number of sigma used to measure the error bars.
VSCALING_MIN: 0.2
VSCALING_MAX: 0.2


# PYKLIP PARAMETERS
FIRST_TIME: True
FIRST_TIME_GS: True #first time doing pyklip gridsearch
#if FIRST_TIME=True the masks, reduced data, noise map, PSF lib, KL vectors are (re)calculated.
DISK_MODEL: original # original or modified Max MB model code
pyklip:
  mode: ADI  #ADI or  RDI (probably also work for SDI and ADI + SDI but too slow to be usefull)
  do_rdi_correlation: False # Measure the correlation matrix of the RDI PSF lib. Very long.
  # KL mode number optimized for z-band, 2x2 binning, minor axis flux 02/20/24 JKK
  klmode_number: 6 # number of KL modes used in the reduction < nb images in the basis
  annuli: 1 # number of annuli in the KLIP reduction

  # KLIP params optimized for ctrl region speckles, minor axis, 2x2 binning, 08/04/24 JKK
  # Fixing minrot to 6, bc minor axis flux optimization favors
  # very high minrot, outer disk suffers greatly, harder to subtract artifacts.
  IWA: 10 # pixels
  # OWA: 112 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
  # OWA: 36 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
  OWA: 112 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
  move_here: 7  #minrot in PyKLIP ADI
  hp_filter: False #size of FWHM for HP filter, disabled in diskfit_mcmc for now
  #use [int((thumb_dim+1)/2),int((thumb_dim+1)/2)]
  # ALIGNED_CENTER: [112.5,112.5]  #image center in your model, also use to center the image before KLIP
  aligned_center: [111.5,111.5] #image center in your model, also use to center the image before KLIP

#  In the KLIP do you want to remove the images where the disk is on the satspots 
# if True: frames are removed
# if False: frames are not removed
# The images where the disk is on the satspots are autonatically remove to measure the PSF
# LOCATION AND NAME PARAMETERS. Parameters used to save the outputs or plots
# BAND_DIR: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci2/norm_lite_psflib  # name of folder where are the data (from basedir)
#                         # Carefull, this dir must also contains the data
# FILE_PREFIX: Ls_clio_20140411_12 #prefix for all saved files (carefull not to erase your results)

band_dir: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci2/lite_psflib  # name of folder where are the data (from basedir)
file_prefix: camsci2_z_20230309_10 #prefix for all saved files (carefull not to erase your results)
rdi_dir: lite_psflib       # name of folder where are the RDI lib (starting from BAND_DIR). 



metadata:
  instrument: MagAO-X  # SPHERE or GPI
  band_name: 2023 Mar 9, $z'$ band #for plot titles uniquely
  # STAR OBSERVATION PARAMETERS
  distance_star: 72.8   #distance of the disk in pc
  pixscale_ins: 0.012  #picscale of your data
  wl: 0.908 #wavelength in microns
  filter_name: $z'$
  prim_mirror_sz: 6.5 #meters



disk_model:
  # INITIAL MODEL PARAMETERS
  r1_init: 76.0 #include just for initializing the mask function
  r2_init: 88.00 #include just for initializing the mask function
  rc_init: 77.7 #35.5 #trying 39. for the masks
  alpha_in_init: 12
  alpha_out_init: -12
  beta_init: 12.3
  a_r_init: 0.01
  inc_init: 76.8 #trying 45. init for the mask2minimize
  pa_init: 24.9
  dx_init: -4.2
  dy_init: 1.5
  N_init: 895.2
  rscale_init: 10
  dtheta_init: 1.00
  # amin_init: 0.68 #microns
  # amax_init: 10000. #microns, let's fix this for now
  aexp_init: 3.5 #radial pwer law for size distribution of grains
  r_inner: 65
  r_outer: 110

# MODEL PARAMETER STATES [0,1] --> [fixed, free]
r1_state: 1
r2_state: 1
rc_state: 1
alpha_in_state: 1
alpha_out_state: 1
beta_state: 1
a_r_state: 0
inc_state: 1
pa_state: 1
dx_state: 1
dy_state: 1
N_state: 1
rscale_state: 0
dtheta_state: 1
# amin: 0
# amax: 0
# aexp: 0
g1_state: 1
g2_state: 1
alpha1_state: 1
g3_state: 0
alpha2_state: 0

RPROFSUB: True

# APERTURE PHOTOMETRY
AP_RING_RAD: 90 #circle defining where to plop down apertures, deprojected disk
AP_RING_DX: -5
AP_RING_DY: -4
AP_RAD: 10 #pixels
STAR_FLUX_DENSITY: 11.083636934249004 # Jy
CONV_FACTOR: 2.4693741506195597e-07 # Jy


mask:
  # MASKING PARAMETERS
  in_scaling: 7 #bigger means shrink inner bound
  out_scaling: 7 #bigger means expand outer bound
  speckles: 10 #central circle mask
  # Make a tight mask for the noisemap calculation
  noise_in: 3
  noise_out: 3
  minor: 81 #OWA to isolate minor axis
  dx: 0
  dy: -3.6

noise:
  use: true
  delta_radii: 1 #width of noisemap rings


# offset: 0.


lambda_reg: 0.001




# MCMC PLOTTING PARAMETERS
BURNIN: 400   #We remove the first BURNIN iteration
THIN: 1       #thin (bin) the chains
QUALITY_PLOT: 4 # usefull because corner plots can be huge. When paper, QUALITY_PLOT: 4
sigma: 3 # the number of sigma used to measure the error bars.
VSCALING_MIN: 1.0
VSCALING_MAX: 1.0

# MCMC PLOTTING PARAMETERS. 
# NAME and descirption THAT WILL APPEARS IN THE CORNER PLOTS
# and printed analysis 
NAMES:
- R1
- R2
# - RC
- Beta
# - alpha_in
# - alpha_out
- a_r
- inc
- PA
- dx
- dy
- Norm
# - rscale
# - amin
# - amax
# - aexp
# - offset
- g1
- g2
- Alph1
# - g3
# - Alph2
- Argpe
- R1mas
- ecc
# - Omega
# - ekowa
# - ikowa
# - RA
# - Decl
# - RAp
# - Declp
# - Rkowa


LABELS:
  Alph1: $\alpha$1
  Alph2: $\alpha$2
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Norm: $N$[ADU]
  a_r: a_r
  PA: $pa[^{\circ}]$
  R1: R1[au]
  R2: R2[au]
  RC: $R_c$[au]
  dx: $dx$[au]
  dy: $dy$[au]
  g1: g1
  g2: g2
  g3: g3
  inc: $i[^{\circ}]$
  rscale: rscale[ADU]
  amin: $a_{min}$[um]
  amax: amax[um]
  aexp: aexp

VARIABLES:
  Alph1: $\alpha$1
  Alph2: $\alpha$2
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Norm: $N$
  a_r: a_r
  PA: $pa$
  R1: R1
  R2: R2
  RC: $R_c$
  dx: $dx$
  dy: $dy$
  g1: g1
  g2: g2
  g3: g3
  inc: $i$
  amin: $a_{min}$
  amax: amax
  aexp: aexp

COMMENTS:
  Argpe: ' deg, argument of pericentre'
  Alph1: ' %, first relative HG weight'
  Alph2: ' %, second relative HG weight'
  alpha_in: ' inner radial power law'
  alpha_out: ' outer radial power law'
  Beta: ' radial power law'
  Norm: ' ADU, normalisation'
  a_r: ' aspect ratio'
  PA: ' degree, principal angle'
  R1: ' AU, inner radius'
  R2: ' AU, outer radius'
  RC: ' AU, max density radius'
  dx: ' au, + -> NW offset disk plane Minor Axis'
  dy: ' au, + -> SW offset disk plane Major Axis'
  g1: ' %, 1st HG param'
  g2: ' %, 2nd HG param'
  g3: ' %, 3rd HG param'
  inc: ' degree, inclination'
  R1mas: ' mas, inner radius'
  ecc: ' eccentricity (deprojected, or disk plane)'
  amin: ' um, min grain size'
  amax: ' um, max grain size'
  aexp: ' power grain size distribution'

  # R2mas: 'mas, outer radius'
  # ekowa: deproj. (true) eccentricity (Kowalsky)
  # ikowa: degree, deproj. (true) inclination (Kowalsky)
  #RA: mas, ->E right ascension
  # RAp: pix, ->E right ascension
  # Rkowa: mas, deproj. (true) semi major axis (Kowalsky)
  # Decl: mas, ->N declination
  # Declp: pix, -> N declination
  # Omega: deg, longitude of the ascending node

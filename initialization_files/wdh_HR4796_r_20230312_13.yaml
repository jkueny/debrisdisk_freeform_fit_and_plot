  Alph1: $\alpha$1[%]
  Alph2: $\alpha$2[%]
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Beta2: $\beta$2
  offset: $dz$
  Norm: $N$[ADU]
  Norm2: $N$2[ADU]
  Norm3: $N$3[ADU]
  a_r: a_r
  a_r2: a_r2
  a_r3: a_r3
  sig: $\sigma$
  sig2: $\sigma$2
  PA: $pa[^{\circ}]$
  PA2: $pa2[^{\circ}]$
  PA3: $pa3[^{\circ}]$
  R1: R1[au]
  R2: R2[au]
  RC: $R_c$[au]
  dx: $dx$
  dx2: $dx$2
  dy: $dy$
  dy2: $dy$2
  dy3: $dy$3
  g1: g1[%]

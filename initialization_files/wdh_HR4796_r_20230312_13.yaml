  g3: g3[%]
  inc: $i[^{\circ}]$
  rscale: rscale[ADU]
  amin: $a_{min}$[um]
  amax: amax[um]
  aexp: aexp

VARIABLES:
  Alph1: $\alpha$1
  Alph2: $\alpha$2
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Beta2: $\beta$2
  Norm: $N$

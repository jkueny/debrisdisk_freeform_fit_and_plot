# PYKLIP PARAMETERS
FIRST_TIME: true
FIRST_TIME_GS: False #first time doing pyklip gridsearch
#if FIRST_TIME=True the masks, reduced data, noise map, PSF lib, KL vectors are (re)calculated.
DISK_MODEL: wdh # original or modified Max MB model code
MODE: ADI  #ADI or  RDI (probably also work for SDI and ADI + SDI but too slow to be usefull)
DO_RDI_CORRELATION: False # Measure the correlation matrix of the RDI PSF lib. Very long.
# KL mode number optimized for z-band, 2x2 binning, minor axis flux 02/20/24 JKK
KLMODE_NUMBER: 2 # number of KL modes used in the reduction < nb images in the basis
ANNULI: 1 # number of annuli in the KLIP reduction
# IWA optimized for z-band speckles, 2x2 binning, minor axis flux 03/20/24 JKK
IWA: 10 # pixels
OWA: 112 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
MOVE_HERE: 6  #minrot in PyKLIP ADI
HP_FILTER: False #size of FWHM for HP filter, disabled in diskfit_mcmc for now
#use [int((thumb_dim+1)/2),int((thumb_dim+1)/2)]
# ALIGNED_CENTER: [120,120] #image center in your model, also use to center the image before KLIP
ALIGNED_CENTER: [111.5,111.5] #image center in your model, also use to center the image before KLIP
WL: 0.908 #wavelength in microns
# The optimal parang span is 84 deg.

#  In the KLIP do you want to remove the images where the disk is on the satspots 
# if True: frames are removed
# if False: frames are not removed
RM_FILE_DISK_CROSS_SATSPOTS: False 
# The images where the disk is on the satspots are autonatically remove to measure the PSF
INSTRUMENT: MagAO-X  # SPHERE or GPI
# LOCATION AND NAME PARAMETERS. Parameters used to save the outputs or plots
BAND_DIR: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci2/lite_wdhlib  # name of folder where are the data (from basedir)
KLIP_FM_FILES_PATH: null # location of ff_klip/ff_setup output folder klip_fm_files. Optional. If null, BAND_DIR/klip_fm_files is used.
RDI_DIR: null       # name of folder where are the RDI lib (starting from BAND_DIR). 
#                         # Carefull, this dir must also contains the data
# FILE_PREFIX: Ls_clio_20140411_12 #prefix for all saved files (carefull not to erase your results)
FILE_PREFIX: camsci2_z_20230309_10 #prefix for all saved files (carefull not to erase your results)
BAND_NAME: 2023 Mar 9, $z'$ band #for plot titles uniquely

# STAR OBSERVATION PARAMETERS
DISTANCE_STAR: 72.248   #distance of the disk in pc
PIXSCALE_INS: 0.012  #picscale of your data

# GRIDSEARCH PARAMS
GRIDSEARCH_DIR: pyklip_reduced
IWA_MIN: 5
IWA_MAX: 16
MINROT_MIN: 10
MINROT_MAX: 12
PARANG_MIN: 80
PARANG_MAX: 88
HP_MIN: 15
HP_MAX: 32

# MCMC PARAMETERS
NEW_BACKEND: True
#if NEW_BACKEND=0, reset the backend, if not, start where you stopped
NWALKERS: 188 #Number of walkers (should be at least twice the # parameters)
#~530 iter w/ 94 cpus in 24 hr
N_ITER_MCMC: 1000 #Number of interation
NOISE_MULTIPLICATION_FACTOR: 1 # multiplicative factor for the chains, previously 3; 04/25/23
# There is no burn-in phase here, the burnin only intervened when reading the data

# Disk model parameters
# INITIAL MODEL PARAMETERS
r1_init: 74.0 #include just for initializing the mask function
# r1_init: 60.0 #include just for initializing the mask function
r2_init: 88.00 #include just for initializing the mask function
# r2_init: 120.00 #include just for initializing the mask function
rc_init: 74.31 #35.5 #trying 39. for the masks
alpha_in_init: 50.
# alpha_in_init: 12.
alpha_out_init: -14.08
beta_init: 14.8
a_r_init: 0.01
inc_init: 76.77
pa_init: 25.0
# pa_init: -90.0
dx_init: -3.16
dy_init: 1.49
N_init: 1385.77
r_inner: 65
r_outer: 110
g1_init: 0.96
g2_init: -0.1744
alpha1_init: 0.3184


# WIND PARAMETERS
N_WIND_LAYERS: 3
gamma_fixed: 1.0
beta_shared_state: true
a_r_shared_state: true
sig_shared_state: true
dx_shared_state: false
Norm_shared_state: false
pa_prior_sigma: 15.0

hr1_init: 0.1 #include just for initializing the mask function
hr2_init: 60 #include just for initializing the mask function

rscale_init: 1.01
hbeta_init: 0.5
ha_r_init: 0.3
hsig_init: 30.0
hfwhm_init: 3.0
hpa_init: 69.5
hdx_init: 1.45
hdy_init: 0.007
hN_init: 13460
dtheta_init: 1.0
fwhm_init: 3.0

hbeta2_init: 0.5
ha_r2_init: 0.29270564274473104
hsig2_init: 30.0
hpa2_init: 93.8
hdx2_init: -1.736274318840326
hdy2_init: 2.7432967701360966
hdz2_init: 0.01
hN2_init: 161.752741323

hbeta3_init: 0.5
ha_r3_init: 0.9278058937026628
hsig3_init: 30.0
hpa3_init: 147.2
hdx3_init: 1.736274318840326
hdy3_init: 1.2852098741333626
hN3_init: 134.862950151
# hoffset_init: -2
# WIND PARAMETER STATES [0,1] --> [fixed, free]
rscale_state: 0
hbeta_state: 1
ha_r_state: 1
hsig_state: 1
hpa_state: 1
hdx_state: 1
hdy_state: 1
hdz_state: 1
# hoffset_state: 1
hN_state: 1
dtheta_state: 1

hbeta2_state: 1
ha_r2_state: 1
hsig2_state: 1
hpa2_state: 1
hdx2_state: 1
hdy2_state: 1
hdz2_state: 1
hN2_state: 1
dtheta2_state: 0

hbeta3_state: 1
ha_r3_state: 1
hpa3_state: 1
hdy3_state: 1
hN3_state: 1

# Added explicit third-component aliases used by the refactored parser.
beta3_state: 1
a_r3_state: 1
sig3_state: 1
pa3_state: 0
dx3_state: 1
dy3_state: 1
Norm3_state: 1

ADD_WDH: 0
USE_NOISE: True
# If the radial prof was subtracted during the image preprocessing + registration
RPROFSUB: True


# MASKING PARAMETERS
MASK_IN_SCALING: 2
MASK_OUT_SCALING: 1
MASK_SPECKLES: 14 #central circle mask
MASK_MINOR: 58 #OWA to isolate minor axis
MASK_DX: 0
MASK_DY: -3
DELTA_RADII: 1 #width of noisemap rings
MASK_SELFSUB_LOWER: 350
MASK_SELFSUB_UPPER: 54
# Measured disk spine profile in z'
WIDOW_MASK: False
WIDOW_PT1: [127,130] #[y,x], 53.4 deg from horizontal
WIDOW_PT2: [138,107] #[y,x], -11.1 deg from horizontal 
WIDOW_PT3: [98,91] #[y,x], 53.4 deg from horizontal
WIDOW_PT4: [87,117] #[y,x], -11.1 deg from horizontal 

# offset: 0.
# the parameter of the priors are still defined inside the code logp(theta) function

# SPF parameters
SPF_MODEL: hg_2g # Heyniey greenstein ('hg_1g', 'hg_2g', 'hg_3g') or 
# SPF_MODEL: adp # Agglomerated Dust Particle; Arnold et al. 2022
SPF_BASIS: legendre # Fit Fourier series model

MIN_SCATT_ANG: 13
MAX_SCATT_ANG: 167
N_BASIS: 13

# for 1g SPF (N_DIM_MCMC = 9) and more
g1_init: 0.83

# for 2g SPF (N_DIM_MCMC = 11) and 3g SPF (N_DIM_MCMC = 13) only
g2_init: -0.19
alpha1_init: 0.32 

# for 3g SPF (N_DIM_MCMC = 13) only
g3_init: -0.1
alpha2_init: 0.1


# MCMC PLOTTING PARAMETERS
BURNIN: 600   #We remove the first BURNIN iteration
THIN: 1       #thin (bin) the chains
QUALITY_PLOT: 4 # usefull because corner plots can be huge. When paper, QUALITY_PLOT: 4
sigma: 1 # the number of sigma used to measure the error bars.
VSCALING_MIN: 0.1
VSCALING_MAX: 0.1

# MCMC vector tokens (order matches windfit_mcmc.arr_free_params with current *_state flags)
NAMES:
  - beta_1
  - h0_1
  - sigma_1
  - PA_1
  - PA_2
  - PA_3
  - x0_1
  - Norm_1
  - x0_2
  - Norm_2
  - x0_3
  - Norm_3

LABELS:
  beta_1: $\beta$ (shared)
  h0_1: $h_0$ / $a_r$ (shared)
  sigma_1: $\sigma$ (shared)
  PA_1: $PA$, layer 1
  PA_2: $PA$, layer 2
  PA_3: $PA$, layer 3
  x0_1: $x_0$, layer 1
  Norm_1: Norm, layer 1
  x0_2: $x_0$, layer 2
  Norm_2: Norm, layer 2
  x0_3: $x_0$, layer 3
  Norm_3: Norm, layer 3

VARIABLES:
  beta_1: beta_1
  h0_1: h0_1
  sigma_1: sigma_1
  PA_1: PA_1
  PA_2: PA_2
  PA_3: PA_3
  x0_1: x0_1
  Norm_1: Norm_1
  x0_2: x0_2
  Norm_2: Norm_2
  x0_3: x0_3
  Norm_3: Norm_3

COMMENTS:
  beta_1: 'WDH radial exponent beta (shared across layers)'
  h0_1: 'WDH scale h0 / a_r (shared)'
  sigma_1: 'WDH sigma, arc opening (shared)'
  PA_1: 'Position angle, layer 1 (Gaussian-regularized around init)'
  PA_2: 'Position angle, layer 2 (Gaussian-regularized around init)'
  PA_3: 'Position angle, layer 3 (Gaussian-regularized around init)'
  x0_1: 'Offset x0 along rotated axis, layer 1'
  Norm_1: 'Amplitude Norm, layer 1'
  x0_2: 'Offset x0, layer 2'
  Norm_2: 'Amplitude Norm, layer 2'
  x0_3: 'Offset x0, layer 3'
  Norm_3: 'Amplitude Norm, layer 3'

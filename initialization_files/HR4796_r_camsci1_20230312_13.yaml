# PYKLIP PARAMETERS
FIRST_TIME: False
FIRST_TIME_GS: True #first time doing pyklip gridsearch
#if FIRST_TIME=True the masks, reduced data, noise map, PSF lib, KL vectors are (re)calculated.
DISK_MODEL: original # original or modified Max MB model code
MODE: ADI  #ADI or  RDI (probably also work for SDI and ADI + SDI but too slow to be usefull)
# KLIP RDI parameters
DO_RDI_CORRELATION: false # Measure the correlation matrix of the RDI PSF lib. Very long.
CLEAN_FINAL_IMAGE: true # do a final post-KLIP median radial profile subtraction 

# KL mode number optimized for z-band, 2x2 binning, minor axis flux 02/20/24 JKK
KLMODE_NUMBER: 16 # number of KL modes used in the reduction < nb images in the basis
ANNULI: 1 # number of annuli in the KLIP reduction
  # IWA optimized for z-band speckles, 2x2 binning, minor axis flux 03/20/24 JKK
IWA: 10 # pixels
  # OWA: 112 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
  # OWA: 36 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
OWA: 100 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
MOVE_HERE: 9  #minrot in PyKLIP ADI
HP_FILTER: False #size of FWHM for HP filter, disabled in diskfit_mcmc for now
ALIGNED_CENTER: [111.5,111.5] #image center in your model, also use to center the image before KLIP


# LOCATION AND NAME PARAMETERS. Parameters used to save the outputs or plots
BAND_DIR: HR4796_rg_smlyot_20230312_13/raws_rg_smlyot_20230313T043914/camsci1/lite_psflib  # name of folder where are the data (from basedir)
RDI_DIR: lite_psflib       # name of folder where are the RDI lib (starting from BAND_DIR). 
#                         # Carefull, this dir must also contains the data
# FILE_PREFIX: Ls_clio_20140411_12 #prefix for all saved files (carefull not to erase your results)
FILE_PREFIX: camsci1_r_20230312_13 #prefix for all saved files (carefull not to erase your results)


# metadata
# STAR OBSERVATION PARAMETERS
DISTANCE_STAR: 72.248   #distance of the disk in pc
PIXSCALE_INS: 0.012  #picscale of your data
FILTER_NAME: $r'$
INSTRUMENT: MagAO-X  # SPHERE or GPI
WL: 0.615 #wavelength in microns
BAND_NAME: 2023 Mar 13, $r'$ band #for plot titles uniquely
PRIM_MIRROR_SZ: 6.5 #meters


# Disk model parameters
  # INITIAL MODEL PARAMETERS
r1_init: 76.0 #include just for initializing the mask function
r2_init: 88.00 #include just for initializing the mask function
# r2_init: 100.00 #include just for initializing the mask function
rc_init: 77.7 #35.5 #trying 39. for the masks
alpha_in_init: 48.00
alpha_out_init: -12.70
beta_init: 12.6
a_r_init: 0.015
inc_init: 76.75 #trying 45. init for the mask2minimize
pa_init: 25.4
dx_init: -2.14
dy_init: 1.31
N_init: 958.62
r_inner: 65.0
r_outer: 110.0
g1_init: 0.82
g2_init: -0.20
alpha1_init: 0.30

# MODEL PARAMETER STATES [0,1] --> [fixed, free]
r1_state: 1
r2_state: 0
rc_state: 0
alpha_in_state: 0
alpha_out_state: 0
beta_state: 1
a_r_state: 1
inc_state: 0
pa_state: 0
dx_state: 1
dy_state: 1
N_state: 1
rscale_state: 0
# amin: 0
# amax: 0
aexp: 2.5
g1_state: 1
g2_state: 1
alpha1_state: 1
g3_state: 0
alpha2_state: 0

RPROFSUB: True

# APERTURE PHOTOMETRY
AP_RING_RAD: 90 #circle defining where to plop down apertures, deprojected disk
AP_RING_DX: -5
AP_RING_DY: -4
AP_RAD: 10 #pixels
STAR_FLUX_DENSITY: 15.997851784224686
CONV_FACTOR: 1.112939359925286e-08 # Jy / Ang.


# MASKING PARAMETERS
# MASKING PARAMETERS
MASK_IN_SCALING: 3 #bigger means shrink the inner bound
MASK_OUT_SCALING: 6 #bigger means expand the outer bound
MASK_SPECKLES: 6 #central circle mask
MASK_MINOR: 55 #OWA to isolate minor axis
MASK_DX: 0
MASK_DY: -3
MASK_NOISE_IN: 3
MASK_NOISE_OUT: 3

USE_NOISE: true
NOISE_DELTA_RADII: 1 #width of noisemap rings


DISK_MIN_SC_ANG: 13 #degrees, the geometry of the disk scattering
DISK_MAX_SC_ANG: 167 #this will never change

# SPF parameters
SPF_FILE: HR4796/phase_functions
SPF_MODEL: hg_2g # Heyniey greenstein ('hg_1g', 'hg_2g', 'hg_3g') or 
# SPF_MODEL: adp # Agglomerated Dust Particle; Arnold et al. 2022
SPF_BASIS: ortho_bessel # Fit Fourier series model


MIN_SCATT_ANG: 10
MAX_SCATT_ANG: 180
N_BASIS: 12
LAMBDA_REG: 1.0
XRANGE_MAX: 10 #max x value to compute the Bessel function


# MCMC PLOTTING PARAMETERS
BURNIN: 500   #We remove the first BURNIN iteration
THIN: 1       #thin (bin) the chains
QUALITY_PLOT: 4 # usefull because corner plots can be huge. When paper, QUALITY_PLOT: 4
sigma: 1 # the number of sigma used to measure the error bars.
VSCALING_MIN: 1.0
VSCALING_MAX: 1.0

# MCMC PLOTTING PARAMETERS. 
# NAME and descirption THAT WILL APPEARS IN THE CORNER PLOTS
# and printed analysis 
NAMES:
- R1
# - R2
# - RC
- Beta
- a_r
# - alpha_in
# - alpha_out
# - inc
# - PA
- dx
- dy
- Norm
# - rscale
# - amin
# - amax
- aexp
# - a_r
# - offset
- g1
- g2
- Alph1
# - g3
# - Alph2
- Argpe
- R1mas
- ecc
# - Omega
# - ekowa
# - ikowa
# - RA
# - Decl
# - RAp
# - Declp
# - Rkowa


LABELS:
  Alph1: $\alpha$1[%]
  Alph2: $\alpha$2[%]
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Norm: $N$[ADU]
  a_r: a_r
  PA: $pa[^{\circ}]$
  R1: R1[au]
  R2: R2[au]
  RC: $R_c$[au]
  dx: $dx$[au]
  dy: $dy$[au]
  g1: g1[%]
  g2: g2[%]
  g3: g3[%]
  inc: $i[^{\circ}]$
  rscale: rscale[ADU]
  amin: $a_{min}$[um]
  amax: amax[um]
  aexp: aexp

VARIABLES:
  Alph1: $\alpha$1
  Alph2: $\alpha$2
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Norm: $N$
  a_r: a_r
  PA: $pa$
  R1: R1
  R2: R2
  RC: $R_c$
  dx: $dx$
  dy: $dy$
  g1: g1
  g2: g2
  g3: g3
  inc: $i$
  amin: $a_{min}$
  amax: amax
  aexp: aexp

COMMENTS:
  Argpe: ' deg, argument of pericentre'
  Alph1: ' %, first relative HG weight'
  Alph2: ' %, second relative HG weight'
  alpha_in: ' inner radial power law'
  alpha_out: ' outer radial power law'
  Beta: ' radial power law'
  Norm: ' ADU, normalisation'
  a_r: ' aspect ratio'
  PA: ' degree, principal angle'
  R1: ' AU, inner radius'
  R2: ' AU, outer radius'
  RC: ' AU, max density radius'
  dx: ' au, + -> NW offset disk plane Minor Axis'
  dy: ' au, + -> SW offset disk plane Major Axis'
  g1: ' %, 1st HG param'
  g2: ' %, 2nd HG param'
  g3: ' %, 3rd HG param'
  inc: ' degree, inclination'
  R1mas: ' mas, inner radius'
  ecc: ' eccentricity (deprojected, or disk plane)'
  amin: ' um, min grain size'
  amax: ' um, max grain size'
  aexp: ' power grain size distribution'

  # R2mas: 'mas, outer radius'
  # ekowa: deproj. (true) eccentricity (Kowalsky)
  # ikowa: degree, deproj. (true) inclination (Kowalsky)
  #RA: mas, ->E right ascension
  # RAp: pix, ->E right ascension
  # Rkowa: mas, deproj. (true) semi major axis (Kowalsky)
  # Decl: mas, ->N declination
  # Declp: pix, -> N declination
  # Omega: deg, longitude of the ascending node

# PYKLIP PARAMETERS
FIRST_TIME: False
FIRST_TIME_GS: True #first time doing pyklip gridsearch
#if FIRST_TIME=True the masks, reduced data, noise map, PSF lib, KL vectors are (re)calculated.
DISK_MODEL: original # original or modified Max MB model code
MODE: ADI  #ADI or  RDI (probably also work for SDI and ADI + SDI but too slow to be usefull)
# KLIP RDI parameters
DO_RDI_CORRELATION: false # Measure the correlation matrix of the RDI PSF lib. Very long.
CLEAN_FINAL_FM: false # do a final post-KLIP median radial profile subtraction

OPTIMIZE_REFERENCE: true
# KL mode number optimized for z-band, 2x2 binning, minor axis flux 02/20/24 JKK
KLMODE_NUMBER: 20 # number of KL modes used in the reduction < nb images in the basis
# KLMODE_NUMBER: 22 # number of KL modes used in the reduction < nb images in the basis
ANNULI: 1 # number of annuli in the KLIP reduction

# KLIP params optimized for ctrl region speckles, minor axis, 2x2 binning, 08/04/24 JKK
# Fixing minrot to 6, bc minor axis flux optimization favors
# very high minrot, outer disk suffers greatly, harder to subtract artifacts.
IWA: 10 # pixels
# IWA: 12 # pixels
OWA: 112 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
# OWA: 36 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
# OWA: 100 # OWA of the reduction, in pixel. Reduce the zone to accelerate the code.
# move_here: 11  #minrot in PyKLIP ADI
MOVE_HERE: 10  #minrot in PyKLIP ADI
HP_FILTER: False #size of FWHM for HP filter, disabled in diskfit_mcmc for now
#use [int((thumb_dim+1)/2),int((thumb_dim+1)/2)]
# ALIGNED_CENTER: [112.5,112.5]  #image center in your model, also use to center the image before KLIP
ALIGNED_CENTER: [111.5,111.5] #image center in your model, also use to center the image before KLIP


# LOCATION AND NAME PARAMETERS. Parameters used to save the outputs or plots
BAND_DIR: HR4796a_lco2023a_magao-x_20230309_10/raws_20230310T054736_s_lyot_stop/camsci1/lite_psflib  # name of folder where are the data (from basedir)
#                         # Carefull, this dir must also contains the data
# FILE_PREFIX: Ls_clio_20140411_12 #prefix for all saved files (carefull not to erase your results)
FILE_PREFIX: camsci1_i_20230309_10 #prefix for all saved files (carefull not to erase your results)
RDI_DIR: lite_psflib       # name of folder where are the RDI lib (starting from BAND_DIR). 



# metadata
# STAR OBSERVATION PARAMETERS
INSTRUMENT: MagAO-X  # SPHERE or GPI
BAND_NAME: 2023 Mar 9, $i'$ band #for plot titles uniquely
DISTANCE_STAR: 72.8   #distance of the disk in pc
PIXSCALE_INS: 0.012  #picscale of your data
WL: 0.908 #wavelength in microns
FILTER_NAME: $i'$
PRIM_MIRROR_SZ: 6.5 #meters
NORTH_UP_OFFSET: 1.53

# MODEL PARAMETER PRIORS [LOWER, UPPER]
rc_prior: [70, 80]
alpha_in_prior: [10, 100]
alpha_out_prior: [-100, -10]
beta_prior: [10, 30]
a_r_prior: [0.005, 0.015]
inc_prior: [75, 80]
pa_prior: [20, 30]
dx_prior: [-5, 5]
dy_prior: [-5, 5]
N_prior: [0, None]
g1_prior: [0.50, 0.9999]
g2_prior: [-0.9999, -0.0001]
alpha1_prior: [0.0001, 0.9999]

# INITIAL MODEL PARAMETERS
# Disk model parameters
r1_init: 76.0 #include just for initializing the mask function
r2_init: 88.00 #include just for initializing the mask function
rc_init: 74.31 #35.5 #trying 39. for the masks
alpha_in_init: 50.
alpha_out_init: -14.08
beta_init: 14.8
a_r_init: 0.01
inc_init: 76.77
pa_init: 25.0
dx_init: -3.16
dy_init: 1.49
N_init: 1385.77
r_inner: 65
r_outer: 110
g1_init: 0.8993
g2_init: -0.1744
alpha1_init: 0.3184  
r_inner: 65
r_outer: 110

# BEST MODEL PARAMETERS
rc_best: 74.31
# alpha_in_best: 50.
alpha_in_best: 12.
# alpha_out_best: -14.08
alpha_out_best: -12.
beta_best: 14.8
a_r_best: 0.01
inc_best: 76.77
pa_best: 26.94
dx_best: -3.16
dy_best: 1.49
N_best: 1385.77
g1_best: 0.9045
g2_best: -0.1452
alpha1_best: 0.3651


RPROFSUB: True

# APERTURE PHOTOMETRY
AP_RING_RAD: 90 #circle defining where to plop down apertures, deprojected disk
AP_RING_DX: -5
AP_RING_DY: -4
AP_RAD: 10 #pixels
STAR_FLUX_DENSITY: 12.729412304271893 # Jy
CONV_FACTOR: 1.6192783494243498e-07 # Jy / Ang.


# MASKING PARAMETERS
MASK_IN_SCALING: 5 #bigger means shrink inner bound
MASK_OUT_SCALING: 5 #bigger means expand outer bound
MASK_SPECKLES: 10 #central circle mask
# Make a tight mask for the noisemap calculation
MASK_NOISE_IN: 3
MASK_NOISE_OUT: 3
MASK_MINOR: 81 #OWA to isolate minor axis
MASK_DX: 0
# MASK_DY: -3.6
MASK_DY: -1

USE_NOISE: true
NOISE_DELTA_RADII: 1 #width of noisemap rings


DISK_MIN_SC_ANG: 13 #degrees, the geometry of the disk scattering
DISK_MAX_SC_ANG: 167 #this will never change

# SPF parameters
SPF_FILE: HR4796/phase_functions
SPF_MODEL: hg_2g # Heyniey greenstein ('hg_1g', 'hg_2g', 'hg_3g') or 
# SPF_MODEL: adp # Agglomerated Dust Particle; Arnold et al. 2022
SPF_BASIS: ortho_bessel # Fit Fourier series model


MIN_SCATT_ANG: 10
MAX_SCATT_ANG: 180
N_BASIS: 12
LAMBDA_REG: 0.01
XRANGE_MAX: 10 #max x value to compute the Bessel functions



# for 3g SPF (N_DIM_MCMC = 13) only
g3_init: -0.1
alpha2_init: 0.1


# MCMC PLOTTING PARAMETERS
BURNIN: 1600   #We remove the first BURNIN iteration
THIN: 1       #thin (bin) the chains
QUALITY_PLOT: 4 # usefull because corner plots can be huge. When paper, QUALITY_PLOT: 4
sigma: 1 # the number of sigma used to measure the error bars.
VSCALING_MIN: 0.75
VSCALING_MAX: 0.75

# MCMC PLOTTING PARAMETERS. 
# NAME and descirption THAT WILL APPEARS IN THE CORNER PLOTS
# and printed analysis 
NAMES:
# - R1
- R2
# - RC
- Beta
# - alpha_in
# - alpha_out
- a_r
# - inc
# - PA
- dx
- dy
- Norm
# - rscale
# - amin
# - amax
# - aexp
# - a_r
# - offset
- g1
- g2
- Alph1
# - g3
# - Alph2
- Argpe
- R1mas
- ecc
# - Omega
# - ekowa
# - ikowa
# - RA
# - Decl
# - RAp
# - Declp
# - Rkowa


LABELS:
  Alph1: $\alpha$1
  Alph2: $\alpha$2
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Norm: $N$[ADU]
  a_r: a_r
  PA: $pa[^{\circ}]$
  R1: R1[au]
  R2: R2[au]
  RC: $R_c$[au]
  dx: $dx$[au]
  dy: $dy$[au]
  g1: g1
  g2: g2
  g3: g3
  inc: $i[^{\circ}]$
  rscale: rscale[ADU]
  amin: $a_{min}$[um]
  amax: amax[um]
  aexp: aexp

VARIABLES:
  Alph1: $\alpha$1
  Alph2: $\alpha$2
  alpha_in: $\alpha_{in}$
  alpha_out: $\alpha_{out}$
  Beta: $\beta$
  Norm: $N$
  a_r: a_r
  PA: $pa$
  R1: R1
  R2: R2
  RC: $R_c$
  dx: $dx$
  dy: $dy$
  g1: g1
  g2: g2
  g3: g3
  inc: $i$
  rscale: rscale
  amin: $a_{min}$
  amax: amax
  aexp: aexp

COMMENTS:
  Argpe: ' deg, argument of pericentre'
  Alph1: ' %, first relative HG weight'
  Alph2: ' %, second relative HG weight'
  alpha_in: ' inner radial power law'
  alpha_out: ' outer radial power law'
  Beta: ' radial power law'
  Norm: ' ADU, normalisation'
  a_r: ' aspect ratio'
  PA: ' degree, principal angle'
  R1: ' AU, inner radius'
  R2: ' AU, outer radius'
  RC: ' AU, max density radius'
  dx: ' au, + -> NW offset disk plane Minor Axis'
  dy: ' au, + -> SW offset disk plane Major Axis'
  g1: ' %, 1st HG param'
  g2: ' %, 2nd HG param'
  g3: ' %, 3rd HG param'
  inc: ' degree, inclination'
  R1mas: ' mas, inner radius'
  ecc: ' eccentricity (deprojected, or disk plane)'
  amin: ' um, min grain size'
  amax: ' um, max grain size'
  aexp: ' power grain size distribution'

  # R2mas: 'mas, outer radius'
  # ekowa: deproj. (true) eccentricity (Kowalsky)
  # ikowa: degree, deproj. (true) inclination (Kowalsky)
  #RA: mas, ->E right ascension
  # RAp: pix, ->E right ascension
  # Rkowa: mas, deproj. (true) semi major axis (Kowalsky)
  # Decl: mas, ->N declination
  # Declp: pix, -> N declination
  # Omega: deg, longitude of the ascending node
